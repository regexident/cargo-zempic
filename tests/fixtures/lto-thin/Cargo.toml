[package]
name = "lto-thin"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lto-thin"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = "thin"
strip = "symbols"
panic = "abort"
codegen-units = 1
incremental = false
debug = false
debug-assertions = false
overflow-checks = false
split-debuginfo = "packed"

[profile.release.package."*"]
opt-level = "z"
