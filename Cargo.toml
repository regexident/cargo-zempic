[package]
name = "cargo-zempic"
description = "Cargo command for optimization a project's binary size"
repository = "https://github.com/regexident/cargo-zempic"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.86.0"
version = "0.0.1"

[dependencies]
anyhow = "1.0.104"
camino = "1.2.6"
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml_edit = { version = "0.25.15", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[dev-dependencies.cargo_metadata]
version = "0.23.1"
features = ["builder"]
